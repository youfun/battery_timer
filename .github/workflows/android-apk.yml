# OTP zip is one ABI per APK. arm64-v8a is phones; x86_64 is Chromos/emulators.
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libvips-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.mob/cache
            deps
            _build
            ~/.mix
            ~/.hex
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mob-apk-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mob-apk-${{ runner.os }}-

      - name: Setup Mob Android
        run: bash script/ci_setup_android.sh

      - name: Export OTP paths for Gradle
        run: |
          {
            echo "MOB_ANDROID_OTP_RELEASE=$(grep '^mob.otp_release=' android/local.properties | cut -d= -f2-)"
            echo "MOB_ANDROID_OTP_RELEASE_ARM32=$(grep '^mob.otp_release_arm32=' android/local.properties | cut -d= -f2-)"
            echo "MOB_ANDROID_OTP_RELEASE_X86_64=$(grep '^mob.otp_release_x86_64=' android/local.properties | cut -d= -f2-)"
            echo "MOB_DIR=$(grep '^mob.mob_dir=' android/local.properties | cut -d= -f2-)"
          } >> "$GITHUB_ENV"

      - name: Test
        run: mix test

      - name: Pack arm64-v8a APK
        run: |
          mkdir -p artifacts
          mix mob.pack_apk --abi arm64-v8a --no-install \
            --output artifacts/battery_timer-arm64-v8a.apk

      - name: Pack x86_64 APK
        run: |
          mix mob.pack_apk --abi x86_64 --no-install \
            --output artifacts/battery_timer-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: battery-timer-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA::7}"
          tag="v0.1.0-$sha"
          gh release create "$tag" artifacts/*.apk \
            --title "Battery Log $tag" \
            --notes "Debug APKs: arm64-v8a (phones), x86_64 (Chromos/emulator)." \
            --latest
